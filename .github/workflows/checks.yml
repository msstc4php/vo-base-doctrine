name: Code Quality Checks

# Same gates as msstc4symfony/bundle-standard's php-bundle.yml. That workflow cannot be called from here: its
# standard-check job requires the hex layer layout. The templates job keeps the tool
# configuration byte-identical to the standard instead.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  COMPOSER: composer-ci.json
  EXTENSIONS: mbstring, xml, ctype, iconv, intl, bcmath, mongodb, pdo_sqlite

jobs:
  templates:
    name: Tool configuration matches bundle-standard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: msstc4symfony/bundle-standard
          ref: v4.1.0
          path: .standard
      - name: Compare with the php84 templates
        run: |
          status=0
          compare() { cmp "$1" "$2" || status=1; }
          compare .php-cs-fixer.dist.php .standard/templates/php84/.php-cs-fixer.dist.php
          compare rector.php .standard/templates/php84/rector.php
          compare phpstan-ci.neon .standard/templates/phpstan-ci.neon
          compare Makefile .standard/templates/Makefile
          compare phpunit.xml.dist .standard/templates/phpunit.xml.dist
          compare infection.json5 .standard/templates/infection.json5
          compare .gitignore .standard/templates/gitignore
          sed 's/^    level: max$/    level: 9/' phpstan.dist.neon | cmp - .standard/templates/php84/phpstan.dist.neon || status=1
          exit "$status"

  check:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ${{ env.EXTENSIONS }}
          coverage: none
          tools: composer:v2
      - run: composer update --prefer-dist --no-progress --no-interaction
      - run: make check

  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }}, ${{ matrix.dependencies }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        dependencies: [highest]
        include:
          - php: '8.4'
            dependencies: lowest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ env.EXTENSIONS }}
          coverage: none
          tools: composer:v2
      - run: composer update --prefer-dist --no-progress --no-interaction ${{ matrix.dependencies == 'lowest' && '--prefer-lowest --prefer-stable' || '' }}
      - run: vendor/bin/phpunit

  minimal:
    name: PHPUnit without optional libraries
    runs-on: ubuntu-latest
    env:
      COMPOSER: composer.json
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ${{ env.EXTENSIONS }}
          coverage: none
          tools: composer:v2
      - run: composer update --prefer-dist --no-progress --no-interaction
      - run: vendor/bin/phpunit

  bc-check:
    name: BC check (Roave)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ${{ env.EXTENSIONS }}
          coverage: none
          tools: composer:v2
      - run: composer update --prefer-dist --no-progress --no-interaction
      - name: Roave BC check
        run: |
          if ! base=$(git describe --tags --abbrev=0 --exclude='*-*' HEAD 2>/dev/null); then
            echo "No stable release tag yet: nothing to compare against."
            exit 0
          fi
          vendor/bin/roave-backward-compatibility-check --from="${base}" --install-development-dependencies --format=github-actions --no-interaction

  infection:
    name: Infection (mutation testing)
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ${{ env.EXTENSIONS }}
          coverage: xdebug
          tools: composer:v2
      - run: composer update --prefer-dist --no-progress --no-interaction
      - run: >-
          XDEBUG_MODE=coverage vendor/bin/infection --threads=$(nproc) --no-interaction --logger-github
          --min-msi=75 --min-covered-msi=75 --ignore-msi-with-no-mutations

  orm-without-odm:
    name: ORM branch loads without doctrine/mongodb-odm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, mbstring, bcmath
          coverage: none
          tools: composer:v2
      - run: composer remove --dev doctrine/mongodb-odm phpstan/phpstan-doctrine --no-interaction --no-progress
        env:
          COMPOSER: composer.json
      - run: |
          php tools/check-autoload-isolation.php "$PWD/src/Orm" 'MSSTC4PHP\ValueObject\Doctrine\Orm\'
          php tools/check-autoload-isolation.php "$PWD/src/Shared" 'MSSTC4PHP\ValueObject\Doctrine\Shared\'

  odm-without-orm:
    name: ODM branch loads without doctrine/orm and doctrine/dbal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, mongodb, mbstring, bcmath
          coverage: none
          tools: composer:v2
      - run: composer remove --dev doctrine/orm doctrine/dbal phpstan/phpstan-doctrine --no-interaction --no-progress
        env:
          COMPOSER: composer.json
      - run: |
          php tools/check-autoload-isolation.php "$PWD/src/Odm" 'MSSTC4PHP\ValueObject\Doctrine\Odm\'
          php tools/check-autoload-isolation.php "$PWD/src/Shared" 'MSSTC4PHP\ValueObject\Doctrine\Shared\'

  no-symfony:
    name: No Symfony anywhere it would mean a dependency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Reject a Symfony dependency in sources and manifest
        run: |
          status=0
          if grep -n 'symfony/' composer.json; then
            echo "::error::A symfony/* package is required in composer.json."
            status=1
          fi
          if grep -rn '^use Symfony' src/; then
            echo "::error::A Symfony class is imported in src/."
            status=1
          fi
          exit "$status"
